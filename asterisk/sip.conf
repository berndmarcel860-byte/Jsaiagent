; SIP Configuration for JSAIAgent
; Defines SIP extensions for internal testing

[general]
context=internal
allowguest=no
allowoverlap=no
bindport=5060
bindaddr=0.0.0.0
srvlookup=yes
disallow=all
allow=ulaw
allow=alaw
allow=gsm
language=de
localnet=192.168.0.0/255.255.0.0
externaddr=your_external_ip
nat=force_rport,comedia

; Extension 1000 - Test Caller
[1000]
type=friend
secret=test1000
qualify=yes
nat=force_rport,comedia
host=dynamic
canreinvite=no
context=internal
disallow=all
allow=ulaw
allow=alaw

; Extension 5000 - AI Agent Extension
[5000]
type=friend
secret=test5000
qualify=yes
nat=force_rport,comedia
host=dynamic
canreinvite=no
context=internal
disallow=all
allow=ulaw
allow=alaw
