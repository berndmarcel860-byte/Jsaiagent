; Asterisk Dialplan Configuration - EXAMPLE FILE
; JSAIAgent - AI Phone Agent for Investment Lead Generation
; 
; HINWEIS: Dies ist nur eine Beispiel-Konfiguration!
; Wenn Sie bereits eigene Asterisk-Konfigurationen haben, 
; verwenden Sie diese und fügen Sie nur die Extension 5000 hinzu.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Global variables
AIAGENT_SCRIPT=/pfad/zu/Jsaiagent/python/agi_handler.py

[internal]
; Extension 1000 - Test Caller
exten => 1000,1,NoOp(Incoming call from ${CALLERID(num)})
 same => n,Dial(SIP/1000,20)
 same => n,Hangup()

; Extension 5000 - AI Agent
; When extension 1000 calls 5000, the AI agent is activated
exten => 5000,1,NoOp(AI Agent Call - Caller: ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,NoOp(Starting AI Agent via Python AGI)
 same => n,AGI(${AIAGENT_SCRIPT})
 same => n,Hangup()

; Fallback for invalid extensions
exten => _X.,1,NoOp(Invalid extension: ${EXTEN})
 same => n,Playback(invalid)
 same => n,Hangup()

[default]
include => internal
