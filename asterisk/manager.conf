; Asterisk Manager Interface (AMI) Configuration - EXAMPLE FILE
; For monitoring and managing Asterisk
; 
; HINWEIS: Dies ist nur eine Beispiel-Konfiguration!
; Verwenden Sie Ihre eigenen Asterisk AMI-Konfigurationen.

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[admin]
secret = your_admin_password_here
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.0
read = system,call,log,verbose,command,agent,user,config,command,dtmf,reporting,cdr,dialplan
write = system,call,log,verbose,command,agent,user,config,command,dtmf,reporting,cdr,dialplan
